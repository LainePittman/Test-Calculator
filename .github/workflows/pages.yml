# Publishes the app to GitHub Pages (https://lainepittman.github.io/Pocket-Tools/).
# No build step: unit tests run, then the app files are copied to _site and deployed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/mobile-calculator-app-zfik5g]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests
        run: node test.js
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html style.css themes.js app.js sw.js manifest.webmanifest lib tools icons fonts _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
