<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pocket Tools">
  <title>Pocket Tools</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="preload" href="fonts/PressStart2P-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script src="themes.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1 class="tool-title" id="tool-title">Calculator</h1>
      <button class="icon-btn" id="settings-btn" type="button" aria-label="Change theme"
              aria-haspopup="dialog" aria-expanded="false" aria-controls="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round">
          <path d="M4 7h9M17 7h3M4 17h3M11 17h9"/>
          <circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>
        </svg>
      </button>
    </header>

    <main class="stage">
      <!-- Calculator -->
      <section class="tool tool-calculator" id="tool-calculator" role="tabpanel" aria-labelledby="tab-calculator" hidden>
        <div class="readout calc-display">
          <div class="readout-sub" id="calc-expression" aria-live="polite"></div>
          <output class="readout-main" id="calc-result" data-figlet>0</output>
        </div>
        <div class="keypad">
          <button class="btn alt" data-action="clear" id="calc-clear">AC</button>
          <button class="btn alt" data-action="sign">+/−</button>
          <button class="btn alt" data-action="percent">%</button>
          <button class="btn accent" data-op="/">÷</button>

          <button class="btn" data-digit="7">7</button>
          <button class="btn" data-digit="8">8</button>
          <button class="btn" data-digit="9">9</button>
          <button class="btn accent" data-op="*">×</button>

          <button class="btn" data-digit="4">4</button>
          <button class="btn" data-digit="5">5</button>
          <button class="btn" data-digit="6">6</button>
          <button class="btn accent" data-op="-">−</button>

          <button class="btn" data-digit="1">1</button>
          <button class="btn" data-digit="2">2</button>
          <button class="btn" data-digit="3">3</button>
          <button class="btn accent" data-op="+">+</button>

          <button class="btn wide" data-digit="0">0</button>
          <button class="btn" data-action="decimal">.</button>
          <button class="btn accent" data-action="equals">=</button>
        </div>
      </section>

      <!-- Stopwatch -->
      <section class="tool tool-stopwatch" id="tool-stopwatch" role="tabpanel" aria-labelledby="tab-stopwatch" hidden>
        <div class="readout clock-display">
          <output class="readout-main clock" id="sw-time" aria-live="off" data-figlet>00:00.00</output>
        </div>
        <div class="controls">
          <button class="btn alt" id="sw-secondary" type="button" disabled>Lap</button>
          <button class="btn accent" id="sw-primary" type="button">Start</button>
        </div>
        <ol class="list laps" id="sw-laps" aria-label="Laps"></ol>
      </section>

      <!-- Timer -->
      <section class="tool tool-timer" id="tool-timer" role="tabpanel" aria-labelledby="tab-timer" hidden>
        <div class="timer-view" id="timer-setup">
          <div class="readout clock-display">
            <output class="readout-main clock timer-entry" id="timer-entry" aria-label="Timer length">00h 00m 00s</output>
          </div>
          <div class="chips even" id="timer-presets">
            <button class="chip" type="button" data-preset="60000">1 min</button>
            <button class="chip" type="button" data-preset="300000">5 min</button>
            <button class="chip" type="button" data-preset="600000">10 min</button>
            <button class="chip" type="button" data-preset="1500000">25 min</button>
          </div>
          <div class="keypad timer-keypad">
            <button class="btn" type="button" data-digit="1">1</button>
            <button class="btn" type="button" data-digit="2">2</button>
            <button class="btn" type="button" data-digit="3">3</button>
            <button class="btn" type="button" data-digit="4">4</button>
            <button class="btn" type="button" data-digit="5">5</button>
            <button class="btn" type="button" data-digit="6">6</button>
            <button class="btn" type="button" data-digit="7">7</button>
            <button class="btn" type="button" data-digit="8">8</button>
            <button class="btn" type="button" data-digit="9">9</button>
            <button class="btn" type="button" data-digit="00">00</button>
            <button class="btn" type="button" data-digit="0">0</button>
            <button class="btn alt" type="button" data-action="backspace" aria-label="Delete">⌫</button>
          </div>
          <button class="btn accent action" id="timer-start" type="button" disabled>Start</button>
        </div>

        <div class="timer-view" id="timer-run" hidden>
          <div class="readout clock-display" id="timer-readout">
            <div class="readout-sub" id="timer-status"></div>
            <output class="readout-main clock" id="timer-left" aria-live="off" data-figlet>0:00</output>
            <div class="meter" aria-hidden="true"><div class="meter-fill" id="timer-meter"></div></div>
          </div>
          <div class="chips even">
            <button class="chip" type="button" id="timer-add">+1 min</button>
          </div>
          <div class="controls">
            <button class="btn alt" id="timer-cancel" type="button">Cancel</button>
            <button class="btn accent" id="timer-toggle" type="button">Pause</button>
          </div>
        </div>
      </section>

      <!-- Unit converter -->
      <section class="tool tool-convert" id="tool-convert" role="tabpanel" aria-labelledby="tab-convert" hidden>
        <div class="chips scroll" id="conv-categories" role="group" aria-label="What to convert"></div>
        <div class="readout conv-panel">
          <select class="field" id="conv-from" aria-label="Convert from"></select>
          <input class="readout-main conv-value" id="conv-value" type="text" inputmode="decimal"
                 autocomplete="off" spellcheck="false" aria-label="Amount" value="1">
        </div>
        <button class="icon-btn conv-swap" id="conv-swap" type="button" aria-label="Swap units">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 4v16M4 8l4-4 4 4M16 20V4M12 16l4 4 4-4"/>
          </svg>
        </button>
        <div class="readout conv-panel">
          <select class="field" id="conv-to" aria-label="Convert to"></select>
          <output class="readout-main conv-value" id="conv-result" aria-live="polite"></output>
        </div>
        <p class="readout-sub conv-formula" id="conv-formula"></p>
      </section>

      <!-- Blackjack -->
      <section class="tool tool-blackjack" id="tool-blackjack" role="tabpanel" aria-labelledby="tab-blackjack" hidden>
        <div class="readout bj-table">
          <div class="bj-hand">
            <div class="bj-label"><span>Dealer</span><output class="bj-total" id="bj-dealer-total" aria-label="Dealer total"></output></div>
            <div class="cards" id="bj-dealer-cards" aria-label="Dealer's cards"></div>
          </div>
          <div class="bj-message" id="bj-message" aria-live="polite"></div>
          <div class="bj-hand">
            <div class="bj-label"><span>You</span><output class="bj-total" id="bj-player-total" aria-label="Your total"></output></div>
            <div class="cards" id="bj-player-cards" aria-label="Your cards"></div>
          </div>
        </div>
        <div class="bj-record" aria-label="Your record">
          <div class="bj-stat win"><strong id="bj-won">0</strong><span>Wins</span></div>
          <div class="bj-stat lose"><strong id="bj-lost">0</strong><span>Losses</span></div>
          <div class="bj-stat"><strong id="bj-pushed">0</strong><span>Pushes</span></div>
          <button class="chip bj-reset" id="bj-reset" type="button">Reset</button>
        </div>
        <div class="controls" id="bj-playing" hidden>
          <button class="btn alt" id="bj-hit" type="button">Hit</button>
          <button class="btn accent" id="bj-stand" type="button">Stand</button>
        </div>
        <button class="btn accent action" id="bj-deal" type="button">Deal</button>
      </section>
    </main>

    <nav class="tabbar" role="tablist" aria-label="Tools">
      <button class="tab" role="tab" id="tab-calculator" data-tab="calculator" aria-controls="tool-calculator">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01"/>
        </svg>
        <span class="tab-label">Calculator</span><span class="tab-short" aria-hidden="true">Calc</span>
      </button>
      <button class="tab" role="tab" id="tab-stopwatch" data-tab="stopwatch" aria-controls="tool-stopwatch">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="14" r="7"/><path d="M12 14V10.5M10 3h4M12 3v4M18.5 6.5l1.5-1.5"/>
        </svg>
        <span class="tab-label">Stopwatch</span><span class="tab-short" aria-hidden="true">Watch</span>
      </button>
      <button class="tab" role="tab" id="tab-timer" data-tab="timer" aria-controls="tool-timer">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 3h12M6 21h12M7 3c0 5 5 6 5 9s-5 4-5 9M17 3c0 5-5 6-5 9s5 4 5 9"/>
        </svg>
        <span class="tab-label">Timer</span><span class="tab-short" aria-hidden="true">Timer</span>
      </button>
      <button class="tab" role="tab" id="tab-convert" data-tab="convert" aria-controls="tool-convert">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 8h14M14 4l4 4-4 4M20 16H6M10 12l-4 4 4 4"/>
        </svg>
        <span class="tab-label">Convert</span><span class="tab-short" aria-hidden="true">Units</span>
      </button>
      <button class="tab" role="tab" id="tab-blackjack" data-tab="blackjack" aria-controls="tool-blackjack">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="2.5" width="14" height="19" rx="2"/>
          <path d="M12 8c-1.5 2-3 2.8-3 4.3a1.7 1.7 0 0 0 3 1.1 1.7 1.7 0 0 0 3-1.1C15 10.8 13.5 10 12 8zM12 14v2.5"/>
        </svg>
        <span class="tab-label">Blackjack</span><span class="tab-short" aria-hidden="true">Cards</span>
      </button>
    </nav>
  </div>

  <div class="sheet-backdrop" id="settings" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <h2 id="settings-title">Theme</h2>
      <div class="theme-options" id="theme-options" role="radiogroup" aria-labelledby="settings-title"></div>
      <button class="sheet-done" id="settings-done" type="button">Done</button>
    </section>
  </div>

  <script src="lib/store.js"></script>
  <script src="lib/format.js"></script>
  <script src="lib/fit.js"></script>
  <script src="lib/figlet.js"></script>
  <script src="lib/calculator.js"></script>
  <script src="lib/stopwatch.js"></script>
  <script src="lib/timer.js"></script>
  <script src="lib/units.js"></script>
  <script src="lib/blackjack.js"></script>
  <script src="tools/calculator.js"></script>
  <script src="tools/stopwatch.js"></script>
  <script src="tools/timer.js"></script>
  <script src="tools/convert.js"></script>
  <script src="tools/blackjack.js"></script>
  <script src="app.js"></script>
</body>
</html>
