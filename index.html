<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Calculator">
  <title>Calculator</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="preload" href="fonts/PressStart2P-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script src="themes.js"></script>
</head>
<body>
  <main class="calculator">
    <div class="topbar">
      <button class="settings-btn" id="settings-btn" type="button" aria-label="Change theme"
              aria-haspopup="dialog" aria-expanded="false" aria-controls="settings">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 7h9M17 7h3M4 17h3M11 17h9"/>
          <circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>
        </svg>
      </button>
    </div>
    <div class="display">
      <div class="expression" id="expression" aria-live="polite"></div>
      <output class="result" id="result">0</output>
    </div>
    <div class="keys">
      <button class="key fn" data-action="clear" id="clear">AC</button>
      <button class="key fn" data-action="sign">+/−</button>
      <button class="key fn" data-action="percent">%</button>
      <button class="key op" data-op="/">÷</button>

      <button class="key" data-digit="7">7</button>
      <button class="key" data-digit="8">8</button>
      <button class="key" data-digit="9">9</button>
      <button class="key op" data-op="*">×</button>

      <button class="key" data-digit="4">4</button>
      <button class="key" data-digit="5">5</button>
      <button class="key" data-digit="6">6</button>
      <button class="key op" data-op="-">−</button>

      <button class="key" data-digit="1">1</button>
      <button class="key" data-digit="2">2</button>
      <button class="key" data-digit="3">3</button>
      <button class="key op" data-op="+">+</button>

      <button class="key zero" data-digit="0">0</button>
      <button class="key" data-action="decimal">.</button>
      <button class="key op equals" data-action="equals">=</button>
    </div>
  </main>
  <div class="sheet-backdrop" id="settings" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <h2 id="settings-title">Theme</h2>
      <div class="theme-options" id="theme-options" role="radiogroup" aria-labelledby="settings-title"></div>
      <button class="sheet-done" id="settings-done" type="button">Done</button>
    </section>
  </div>
  <script src="calculator.js"></script>
  <script src="app.js"></script>
</body>
</html>
